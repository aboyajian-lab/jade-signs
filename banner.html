<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jade Big Screen — Sidebar (442x1080)</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  .pane { position:absolute; inset:0; overflow:hidden; }
  .layer1, .layer2 { position:absolute; inset:0; opacity:0; transform:none;
                     will-change:transform,opacity; backface-visibility:hidden; }
  .fill { width:100%; height:100%; object-fit:contain; display:block; }
  .drift { animation: drift 70s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:translate(-10px,-6px) scale(1.02); } to { transform:translate(10px,6px) scale(1.02); } }
  .cdwrap { position:absolute; inset:0; overflow:hidden; background:#000; }
  .cdbg { position:absolute; inset:-4%; width:108%; height:108%; object-fit:cover;
          filter:blur(16px) brightness(.32) saturate(1.1); }
  .cdol { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; gap:2.6vh; color:#f4efe2;
          font-family:'Segoe UI', Verdana, Arial, sans-serif; }
  .cdk { font-size:2.4vh; letter-spacing:.45em; font-weight:600; color:#e05252; }
  .cdt { font-size:6.4vh; font-weight:800; letter-spacing:.06em; line-height:1.1; max-width:86%;
         text-shadow:0 4px 30px rgba(0,0,0,.7); }
  .cdtimer { font-size:12.5vh; font-weight:800; letter-spacing:.06em; font-variant-numeric:tabular-nums;
             text-shadow:0 6px 40px rgba(0,0,0,.8); }
  .cdwhen { font-size:3vh; letter-spacing:.3em; font-weight:600; color:#e9b949; }
  .cdlogo { height:7vh; margin-top:1.6vh; opacity:.95; }
  #fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
              flex-direction:column; color:#e9e2d0; font-family:Georgia,'Times New Roman',serif;
              text-align:center; background:radial-gradient(ellipse at center,#14231c 0%,#0a120e 70%); z-index:9; }
  #fallback h1 { font-size:9vmin; letter-spacing:.35em; margin:0; font-weight:400; }
  #fallback p  { font-size:3.2vmin; letter-spacing:.18em; opacity:.75; margin-top:2vmin;
                 font-family:Verdana,Arial,sans-serif; }
 .cdt{font-size:4vh;} .cdtimer{font-size:6vh;}</style>
</head>
<body>
<div class="pane" id="p-side"><div class="layer1"></div><div class="layer2"></div></div>
<div id="fallback"><h1>THE JADE</h1><p>BIG SCREEN &middot; COURTYARD</p></div>
<script>
var PANE_DEFS = [{ sel: "#p-side", kind: "side" }];

(function () {
  var DIRS = {
    main: { sign: "signs/main_signs/", general: "signs/general_mains/", overnight: "signs/overnight/" },
    side: { sign: "signs/side_banners/", general: "signs/general_banners/", overnight: "signs/overnight_side/" }
  };
  var cfg = { dwell_seconds: 12, data_refresh_minutes: 5, nightly_reload_hour: 4,
              transitions: ["slide-left","slide-up","zoom","flip","slide-right"], transition_ms: 650,
              overnight: { start: "22:00", end: "06:00" },
              countdown: { lead_hours: 36, every_n: 3 }, general_every_n: 3 };
  var data = { signs: [], general_mains: [], general_banners: [], overnight_mains: [], overnight_banners: [] };
  var idx = 0, tcount = 0, lastMode = null;
  var q = location.search;
  var DEMO_CD = q.indexOf("demo=countdown") >= 0, DEMO_NIGHT = q.indexOf("demo=overnight") >= 0;
  var EASE = "cubic-bezier(.22,.61,.36,1)";
  var panes = PANE_DEFS.map(function (p) {
    var root = document.querySelector(p.sel);
    var l1 = root.querySelector(".layer1"), l2 = root.querySelector(".layer2");
    return { kind: p.kind, root: root, a: l1, b: l2, front: null };
  });
  var fallback = document.getElementById("fallback");

  function pad(n) { return String(n).padStart(2, "0"); }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function activeSigns() {
    var t = todayStr();
    return (data.signs || []).filter(function (s) { return s.start <= t && t <= s.end; });
  }
  function inOvernight() {
    if (DEMO_NIGHT) return true;
    var o = cfg.overnight || {}; if (!o.start || !o.end) return false;
    var d = new Date(), cur = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return o.start > o.end ? (cur >= o.start || cur < o.end) : (cur >= o.start && cur < o.end);
  }
  function nextEvent() {
    var now = new Date(), best = null;
    (data.signs || []).forEach(function (s) {
      if (!s.at) return;
      var t = new Date(s.at);
      if (t > now && (!best || t < new Date(best.at))) best = s;
    });
    if (!best) return null;
    if (!DEMO_CD) {
      var hrs = (new Date(best.at) - now) / 36e5;
      if (hrs > ((cfg.countdown && cfg.countdown.lead_hours) || 36)) return null;
    }
    return best;
  }
  function fmtWhen(s) {
    var t = new Date(s.at), now = new Date();
    var hm = t.getHours() % 12 || 12, mm = pad(t.getMinutes()), ap = t.getHours() >= 12 ? "PM" : "AM";
    var time = hm + ":" + mm + " " + ap;
    if (t.toDateString() === now.toDateString()) return "TONIGHT · " + time;
    var DN = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    var MN = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    return DN[t.getDay()] + ", " + MN[t.getMonth()] + " " + t.getDate() + " · " + time;
  }
  function seqFor(kind) {
    if (inOvernight()) {
      var ov = (kind === "main" ? data.overnight_mains : data.overnight_banners) || [];
      return ov.map(function (f) { return { k: "img", dir: DIRS[kind].overnight, f: f, drift: true }; });
    }
    var act = activeSigns(), seq = [], specials = [], si = 0;
    if (kind === "main") {
      var ev = nextEvent();
      if (ev) specials.push({ k: "cd", ev: ev });
      (data.general_mains || []).forEach(function (f) { specials.push({ k: "img", dir: DIRS.main.general, f: f }); });
    } else {
      (data.general_banners || []).forEach(function (f) { specials.push({ k: "img", dir: DIRS.side.general, f: f }); });
    }
    var n = (kind === "main" ? (cfg.countdown && cfg.countdown.every_n) : cfg.general_every_n) || 3;
    if (DEMO_CD && kind === "main" && specials.length) seq.push(specials[0]);
    for (var i = 0; i < act.length; i++) {
      seq.push({ k: "img", dir: DIRS[kind].sign, f: act[i].file });
      if (specials.length && ((i + 1) % n === 0)) { seq.push(specials[si % specials.length]); si++; }
    }
    if (!seq.length) seq = specials.slice();
    return seq;
  }
  function renderItem(layer, item) {
    if (item.k === "img") {
      layer.innerHTML = '<img class="fill' + (item.drift ? " drift" : "") + '" src="' + item.dir + item.f + '" alt="">';
    } else if (item.k === "cd") {
      var s = item.ev;
      layer.innerHTML =
        '<div class="cdwrap">' +
          '<img class="cdbg" src="signs/main_signs/' + s.file + '" alt="">' +
          '<div class="cdol">' +
            '<div class="cdk">UP NEXT ON THE BIG SCREEN</div>' +
            '<div class="cdt">' + (s.title || "").toUpperCase() + "</div>" +
            '<div class="cdtimer" data-target="' + s.at + '">--:--:--</div>' +
            '<div class="cdwhen">' + fmtWhen(s) + "</div>" +
            '<img class="cdlogo" src="assets/jade_logo_cream.png" alt="The Jade">' +
          "</div>" +
        "</div>";
      tickTimers();
    }
  }
  function setT(el, transform, opacity, animate) {
    var ms = cfg.transition_ms || 650;
    el.style.transition = animate ? ("transform " + ms + "ms " + EASE + ", opacity " + ms + "ms " + EASE) : "none";
    el.style.transform = transform;
    el.style.opacity = opacity;
  }
  var IN_FROM = { "slide-left": "translateX(102%)", "slide-right": "translateX(-102%)", "slide-up": "translateY(102%)",
                  "zoom": "scale(1.15)", "flip": "perspective(1600px) rotateY(-70deg) scale(.92)" };
  var OUT_TO = { "slide-left": "translateX(-36%)", "slide-right": "translateX(36%)", "slide-up": "translateY(-36%)",
                 "zoom": "scale(.93)", "flip": "perspective(1600px) rotateY(30deg) scale(.95)" };
  function swapPane(p, item, type) {
    var back = (p.front === p.a) ? p.b : p.a;
    var out = p.front;
    renderItem(back, item);
    var img = back.querySelector("img.fill, img.cdbg");
    var go = function () {
      if (!out) { setT(back, "none", 1, false); p.front = back; return; }
      var soft = (type === "zoom" || type === "flip");
      setT(back, IN_FROM[type] || "none", soft ? 0 : 1, false);
      back.style.zIndex = 3; out.style.zIndex = 2;
      void back.offsetWidth;
      setT(back, "none", 1, true);
      setT(out, OUT_TO[type] || "none", 0, true);
      var old = out;
      setTimeout(function () { setT(old, "none", 0, false); old.innerHTML = ""; }, (cfg.transition_ms || 650) + 80);
      p.front = back;
    };
    if (!img || (img.complete && img.getAttribute("src"))) { go(); } else { img.onload = go; img.onerror = go; }
  }
  function tick() {
    var mode = inOvernight() ? "night" : "day";
    if (mode !== lastMode) { idx = 0; lastMode = mode; }
    var seqs = {};
    panes.forEach(function (p) { seqs[p.kind] = seqFor(p.kind); });
    var empty = panes.every(function (p) { return !seqs[p.kind].length; });
    if (empty) {
      fallback.style.display = "flex";
      panes.forEach(function (p) { setT(p.a, "none", 0, false); setT(p.b, "none", 0, false); p.front = null; });
      return;
    }
    fallback.style.display = "none";
    var types = cfg.transitions && cfg.transitions.length ? cfg.transitions : ["slide-left"];
    var type = types[tcount % types.length]; tcount++;
    panes.forEach(function (p) {
      var seq = seqs[p.kind];
      if (!seq.length) return;
      swapPane(p, seq[idx % seq.length], type);
    });
    idx++;
  }
  function tickTimers() {
    var els = document.querySelectorAll(".cdtimer[data-target]");
    for (var i = 0; i < els.length; i++) {
      var t = new Date(els[i].getAttribute("data-target"));
      var ms = t - new Date();
      if (ms <= 0) { els[i].textContent = "STARTING NOW"; continue; }
      var s = Math.floor(ms / 1000);
      var d = Math.floor(s / 86400); s -= d * 86400;
      var h = Math.floor(s / 3600); s -= h * 3600;
      var m = Math.floor(s / 60); s -= m * 60;
      els[i].textContent = (d > 0 ? d + (d === 1 ? " DAY " : " DAYS ") : "") + pad(h) + ":" + pad(m) + ":" + pad(s);
    }
  }
  setInterval(tickTimers, 500);
  function load() {
    fetch("playlist.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.config) { for (var k in d.config) cfg[k] = d.config[k]; }
        ["signs","general_mains","general_banners","overnight_mains","overnight_banners"].forEach(function (k) { data[k] = d[k] || []; });
      })
      .catch(function () {});
  }
  function loop() { tick(); setTimeout(loop, (cfg.dwell_seconds || 12) * 1000); }
  setInterval(load, (cfg.data_refresh_minutes || 5) * 60 * 1000);
  setInterval(function () {
    var d = new Date();
    if (d.getHours() === (cfg.nightly_reload_hour || 4) && d.getMinutes() === 0) location.reload(true);
  }, 55 * 1000);
  fetch("playlist.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.config) { for (var k in d.config) cfg[k] = d.config[k]; }
      ["signs","general_mains","general_banners","overnight_mains","overnight_banners"].forEach(function (k) { data[k] = d[k] || []; });
    })
    .catch(function () {})
    .then(loop);
})();
</script>
</body>
</html>

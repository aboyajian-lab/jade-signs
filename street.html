<script>
(function () {
  // ---------------------------------------------------------------------------
  // Street sign player. URL options:
  //   ?x=0&y=0&w=576&h=384  draw into an exact pixel box (for the LED processor's capture area)
  //                         default: fit the whole window, centered
  //   ?fit=fill             stretch to fill the whole window (16:9 player -> 3:2 LED wall)
  //   ?still=1              no motion (code-compliance version)
  //   ?slide=Pool           show one slide only (testing)
  //   ?date=2027-01-02      pretend it's this date (testing slide expiry)
  //   ?secs=8               seconds per slide
  // ---------------------------------------------------------------------------
  var ROTATION = [{"f":"Logo"},{"f":"Main"},{"f":"Price1"},{"f":"Promo","until":"2026-12-31"},{"f":"Tour"},{"f":"Movies"},{"f":"Pool"},{"f":"Price2"},{"f":"Tour"},{"f":"Logo2"},{"f":"Ticker"},{"f":"Office"},{"f":"Gym"},{"f":"Pets"},{"f":"Kitchen"},{"f":"Refer"}];
  var q = new URLSearchParams(location.search);
  var SECS = Math.max(3, Number(q.get('secs') || 8));
  var STILL = q.get('still') === '1';
  var ONLY = q.get('slide');
  var RELOAD_MIN = 30;
  var stage = document.getElementById('stage');

  function layout() {
    var W = 1152, H = 768, vw = window.innerWidth, vh = window.innerHeight;
    if (q.get('fit') === 'fill') {
      // Stretch to the whole frame. For players that send a 16:9 frame the LED processor
      // squeezes back onto the 3:2 wall (e.g. Rockbot), so the design lands correctly proportioned.
      stage.style.transform = 'scale(' + (vw / W) + ',' + (vh / H) + ')';
    } else if (q.has('w') && q.has('h')) {
      var w = +q.get('w'), h = +q.get('h');
      stage.style.transform = 'translate(' + (+q.get('x') || 0) + 'px,' + (+q.get('y') || 0) + 'px) scale(' + (w / W) + ',' + (h / H) + ')';
    } else {
      var s = Math.min(vw / W, vh / H);
      stage.style.transform = 'translate(' + ((vw - W * s) / 2) + 'px,' + ((vh - H * s) / 2) + 'px) scale(' + s + ')';
    }
  }
  window.addEventListener('resize', layout);
  layout();

  function today() {
    if (q.get('date')) return q.get('date');
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  }

  function playlist() {
    var d = today();
    var list = ROTATION.filter(function (r) { return !r.until || d <= r.until; });
    if (ONLY) list = list.filter(function (r) { return r.f === ONLY; });
    // never show the same slide twice in a row (e.g. Tour after an expired promo)
    return list.filter(function (r, i) { return i === 0 || r.f !== list[i - 1].f; });
  }

  function show(name) {
    var t = document.getElementById('t-' + name + (STILL ? '-still' : ''));
    stage.innerHTML = '';
    stage.appendChild(t.content.cloneNode(true));   // fresh copy = animations restart
  }

  // Preload every image so slides never pop in half-loaded.
  var seen = {};
  (function () {
    var html = document.documentElement.innerHTML, re = /street\/[\w.-]+\.(?:jpg|png)/g, m;
    while ((m = re.exec(html))) { if (!seen[m[0]]) { seen[m[0]] = 1; new Image().src = m[0]; } }
  })();

  var started = Date.now(), list = [], i = -1;
  function tick() {
    if (i === -1 || i >= list.length - 1) {
      // loop boundary: refresh the playlist (date expiry) and, every 30 min, pull the latest page
      if (Date.now() - started > RELOAD_MIN * 60000) {
        fetch(location.href, { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {});
      }
      list = playlist();
      i = -1;
    }
    i += 1;
    if (list.length) show(list[i].f);
    setTimeout(tick, SECS * 1000);
  }

  var go = function () { if (go) { go = null; tick(); } };
  if (document.fonts && document.fonts.load) {
    Promise.all(['600 100px Cormorant', '700 100px Cormorant', 'italic 600 100px Cormorant', 'italic 700 100px Cormorant',
                 '500 100px Poppins', '600 100px Poppins', '700 100px Poppins']
      .map(function (f) { return document.fonts.load(f); })).then(go, go);
  }
  setTimeout(go, 3000);   // never wait on fonts longer than 3 s
})();
</script>

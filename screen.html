<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jade Big Screen — Full Screen (main + sidebar)</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #stage { display:flex; width:100%; height:100%; }
  #mainwrap { flex:1 1 auto; position:relative; height:100%; overflow:hidden; }
  #sidewrap { flex:0 0 auto; height:100%; aspect-ratio:442/1080; position:relative; overflow:hidden; border-left:2px solid #000; }
  .slide { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
           opacity:0; transform:none; will-change:transform,opacity; backface-visibility:hidden; }
  #fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
              flex-direction:column; color:#e9e2d0; font-family:Georgia,'Times New Roman',serif;
              text-align:center; background:radial-gradient(ellipse at center,#14231c 0%,#0a120e 70%); z-index:9; }
  #fallback h1 { font-size:9vmin; letter-spacing:.35em; margin:0; font-weight:400; }
  #fallback p  { font-size:3.2vmin; letter-spacing:.18em; opacity:.75; margin-top:2vmin;
                 font-family:Verdana,Arial,sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <div id="mainwrap"><img class="slide" id="ma" alt=""><img class="slide" id="mb" alt=""></div>
  <div id="sidewrap"><img class="slide" id="sa" alt=""><img class="slide" id="sb" alt=""></div>
</div>
<div id="fallback"><h1>THE JADE</h1><p>BIG SCREEN &middot; COURTYARD</p></div>
<script>
(function () {
  var MAIN = "signs/main_signs/", SIDE = "signs/side_banners/";
  var cfg = { dwell_seconds: 12, data_refresh_minutes: 5, nightly_reload_hour: 4,
              transitions: ["slide-left","slide-up","zoom","flip","slide-right"], transition_ms: 650 };
  var playlist = [], idx = 0, tcount = 0;
  var panes = [
    { a: document.getElementById("ma"), b: document.getElementById("mb"), front: null, dir: MAIN },
    { a: document.getElementById("sa"), b: document.getElementById("sb"), front: null, dir: SIDE }
  ];
  var fallback = document.getElementById("fallback");
  var EASE = "cubic-bezier(.22,.61,.36,1)";

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function active(all) {
    var t = todayStr();
    return all.filter(function (s) { return s.start <= t && t <= s.end; });
  }
  function setT(el, transform, opacity, animate) {
    var ms = cfg.transition_ms || 650;
    el.style.transition = animate ? ("transform " + ms + "ms " + EASE + ", opacity " + ms + "ms " + EASE) : "none";
    el.style.transform = transform;
    el.style.opacity = opacity;
  }
  var IN_FROM = {
    "slide-left":  "translateX(102%)",
    "slide-right": "translateX(-102%)",
    "slide-up":    "translateY(102%)",
    "zoom":        "scale(1.15)",
    "flip":        "perspective(1600px) rotateY(-70deg) scale(.92)"
  };
  var OUT_TO = {
    "slide-left":  "translateX(-36%)",
    "slide-right": "translateX(36%)",
    "slide-up":    "translateY(-36%)",
    "zoom":        "scale(.93)",
    "flip":        "perspective(1600px) rotateY(30deg) scale(.95)"
  };
  function swapPane(p, src, type) {
    var back = (p.front === p.a) ? p.b : p.a;
    var out = p.front;
    back.src = src;
    var go = function () {
      if (!out) { setT(back, "none", 1, false); p.front = back; return; }
      var soft = (type === "zoom" || type === "flip");
      setT(back, IN_FROM[type] || "none", soft ? 0 : 1, false);
      back.style.zIndex = 3; out.style.zIndex = 2;
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        setT(back, "none", 1, true);
        setT(out, OUT_TO[type] || "none", 0, true);
        var old = out;
        setTimeout(function () { setT(old, "none", 0, false); }, (cfg.transition_ms || 650) + 80);
      }); });
      p.front = back;
    };
    if (back.complete && back.getAttribute("src")) { go(); } else { back.onload = go; }
  }
  function tick() {
    if (!playlist.length) {
      fallback.style.display = "flex";
      panes.forEach(function (p) { setT(p.a, "none", 0, false); setT(p.b, "none", 0, false); p.front = null; });
      return;
    }
    fallback.style.display = "none";
    idx = idx % playlist.length;
    var f = playlist[idx].file;
    var types = cfg.transitions && cfg.transitions.length ? cfg.transitions : ["slide-left"];
    var type = types[tcount % types.length]; tcount++;
    swapPane(panes[0], MAIN + f, type);
    swapPane(panes[1], SIDE + f, type);
    idx++;
    if (playlist.length > 1) {
      var nf = playlist[idx % playlist.length].file;
      new Image().src = MAIN + nf; new Image().src = SIDE + nf;
    }
  }
  function load() {
    fetch("playlist.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.config) { for (var k in data.config) cfg[k] = data.config[k]; }
        var next = active(data.signs || []);
        var changed = JSON.stringify(next) !== JSON.stringify(playlist);
        playlist = next;
        if (changed) { idx = 0; tick(); }
      })
      .catch(function () {});
  }
  function loop() { tick(); setTimeout(loop, (cfg.dwell_seconds || 12) * 1000); }
  setInterval(load, (cfg.data_refresh_minutes || 5) * 60 * 1000);
  setInterval(function () {
    var d = new Date();
    if (d.getHours() === (cfg.nightly_reload_hour || 4) && d.getMinutes() === 0) location.reload(true);
  }, 55 * 1000);
  fetch("playlist.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) { if (data.config) { for (var k in data.config) cfg[k] = data.config[k]; } playlist = active(data.signs || []); })
    .catch(function () {})
    .then(loop);
})();
</script>
</body>
</html>

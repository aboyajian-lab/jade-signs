<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jade Big Screen — Bounce</title>
<!-- DVD-screensaver bouncer. The logo is rendered as a CSS mask so the mark
     itself changes color on every wall hit (hue-rotate does nothing on a
     cream/near-grayscale PNG). Corner hits trigger a scale pulse, not a
     screen flash - night-friendly for the courtyard. -->
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #logo { position:absolute; left:0; top:0; width:17vw; aspect-ratio:1200/693;
          background-color:#e9e2d0; will-change:transform;
          -webkit-mask:url("assets/jade_logo_cream.png?v=2") center/contain no-repeat;
          mask:url("assets/jade_logo_cream.png?v=2") center/contain no-repeat;
          filter:drop-shadow(0 0 14px rgba(0,0,0,.55));
          transition:background-color 350ms ease; }
  #logo.pulse { animation:pulse 600ms ease; }
  @keyframes pulse { 0% { scale:1; } 40% { scale:1.18; } 100% { scale:1; } }
</style>
</head>
<body>
<div id="logo"></div>
<script>
(function () {
  var COLORS = ["#e9e2d0", "#e9b949", "#57b98a", "#e05252", "#7fb3e0", "#c98ae0", "#f0f0f0", "#e08a3c"];
  var logo = document.getElementById("logo");
  var ci = 0, x = 60, y = 80, vx = 2.6, vy = 2.2;
  function bounce(corner) {
    ci++;
    logo.style.backgroundColor = COLORS[ci % COLORS.length];
    if (corner) {
      logo.classList.remove("pulse");
      void logo.offsetWidth;
      logo.classList.add("pulse");
    }
  }
  function step() {
    var W = window.innerWidth, H = window.innerHeight;
    var w = logo.offsetWidth, h = logo.offsetHeight;
    x += vx; y += vy;
    var hitX = false, hitY = false;
    if (x <= 0)     { x = 0;     vx = Math.abs(vx);  hitX = true; }
    if (x >= W - w) { x = W - w; vx = -Math.abs(vx); hitX = true; }
    if (y <= 0)     { y = 0;     vy = Math.abs(vy);  hitY = true; }
    if (y >= H - h) { y = H - h; vy = -Math.abs(vy); hitY = true; }
    if (hitX || hitY) bounce(hitX && hitY);
    logo.style.transform = "translate(" + x + "px," + y + "px)";
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
